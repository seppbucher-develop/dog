<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dog – das Kartenbrettspiel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23d9483b'/><circle cx='16' cy='16' r='6' fill='%23f4f1e8'/></svg>" />
    <script>
      // gewähltes Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen)
      try {
        var t = localStorage.getItem('dog.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
